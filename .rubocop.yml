inherit_from:
  - https://github.com/Alexander-Senko/Alexander-Senko/raw/refs/heads/main/.rubocop.yml
  - https://github.com/Alexander-Senko/Alexander-Senko/raw/refs/heads/main/.rubocop-rspec.yml
  - https://github.com/Alexander-Senko/Alexander-Senko/raw/refs/heads/main/.rubocop-rails.yml

plugins:
  - rubocop-rspec_rails

# Non-application code
AllCops:
  Exclude:
    - '**/bin/*'
    - spec/dummy/{config,db}/**/*.rb
    - spec/dummy/app/**/application_*.rb

Style/Documentation:
  AllowedConstants:
    - Coniverse
    - Engine
    - Current
  Exclude:
    - app/controllers/**/*_controller.rb
    - app/presenters/**/*_presenter.rb
    # HACK: shared configuration gets ignored for some reason
    - app/**/application_*.rb
    - '{db,spec}/**/*.rb'

Metrics/ModuleLength: &spec # testable entity’s namespace
  Exclude:
    - spec/**/concerns/*.rb
    - spec/requests/*.rb
    # HACK: shared configuration gets ignored for some reason
    - spec/**/*_spec.rb
Lint/EmptyBlock: # `let`
  <<: *spec
Style/GlobalVars: # $namespace
  <<: *spec

# Hashes in `let`s
Layout/MultilineBlockLayout:
  <<: *spec
Layout/BlockEndNewline:
  <<: *spec

# Concerns
RSpec/ContextWording:
  Exclude:
    - spec/**/concerns/*.rb

# Generated by `rspec:install`
Style/BlockComments: &spec_helper
  Exclude:
    - spec/spec_helper.rb
Layout/CommentIndentation:
  <<: *spec_helper # false positive
